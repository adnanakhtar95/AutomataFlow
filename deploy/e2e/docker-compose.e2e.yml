# Dashboard end-to-end stack (Phase 6): release images of the Api, Worker and dashboard, PostgreSQL, and the DemoCrm
# TEST FIXTURE. Driven only by scripts/e2e-dashboard.ps1, which generates every secret per run and removes the stack
# and its volumes afterwards. Not a deployment template (see deploy/docker-compose.prod.yml).
name: af-e2e

networks:
  e2e:
    ipam:
      config:
        - subnet: 172.31.250.0/24

x-db: &db Host=postgres;Port=5432;Database=automataflow;Username=automataflow;Password=${AF_E2E_DB_PASSWORD:?generated by the script}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: automataflow
      POSTGRES_PASSWORD: ${AF_E2E_DB_PASSWORD}
      POSTGRES_DB: automataflow
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automataflow -d automataflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${AF_E2E_API_IMAGE:?}
    command: ["migrate"]
    environment:
      ConnectionStrings__Default: *db
      Auth__Jwt__SigningKey: ${AF_E2E_JWT_KEY:?}
    networks: [e2e]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${AF_E2E_API_IMAGE}
    environment:
      ConnectionStrings__Default: *db
      Auth__Jwt__SigningKey: ${AF_E2E_JWT_KEY}
      Auth__AllowRegistration: "true"
      Platform__Mode: Development
      Proxy__TrustedNetworks: 172.31.250.0/24
    volumes:
      - keys:/var/lib/automataflow/keys
      - artifacts:/var/lib/automataflow/artifacts
    networks: [e2e]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: ${AF_E2E_WORKER_IMAGE:?}
    init: false
    user: root
    restart: unless-stopped
    stop_grace_period: 4m
    shm_size: 1g
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, SYS_CHROOT]
    security_opt:
      - seccomp=../verify/chromium-seccomp.json
    environment:
      ConnectionStrings__Default: *db
      DataProtection__KeysDirectory: /var/lib/automataflow/keys
      Artifacts__RootDirectory: /var/lib/automataflow/artifacts
      # DemoCrm lives on a private Docker address: the single exact-origin exception, Development mode only (ADR-047).
      Automation__Browser__Mode: Development
      Automation__Browser__DevelopmentPrivateNetworkOrigins__0: http://democrm:8080
    volumes:
      - keys:/var/lib/automataflow/keys
      - artifacts:/var/lib/automataflow/artifacts
    networks: [e2e]
    depends_on:
      migrate: { condition: service_completed_successfully }

  democrm:
    image: ${AF_E2E_DEMOCRM_IMAGE:?}
    environment:
      AllowedHosts: democrm;127.0.0.1;localhost
      DemoCrm__ControlApi__Token: ${AF_E2E_DEMOCRM_TOKEN:?}
    # Loopback only: the measurement script reads the target's counters through the control API.
    ports:
      - "127.0.0.1:${AF_E2E_DEMOCRM_PORT:-8089}:8080"
    networks: [e2e]

  web:
    image: ${AF_E2E_WEB_IMAGE:?}
    environment:
      AF_API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:${AF_E2E_WEB_PORT:-8088}:8080"
    networks: [e2e]
    depends_on: [api]

volumes:
  keys:
  artifacts:
